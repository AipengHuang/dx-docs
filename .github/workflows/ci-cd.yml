name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dixian-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App CI
    uses: ./.github/workflows/app.yml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend.yml

  docreader:
    name: DocReader CI
    uses: ./.github/workflows/docreader.yml

  deploy-docreader:
    name: Deploy DocReader to Railway
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docreader]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_NAME: production
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.0
      - name: Deploy DocReader
        run: ./scripts/railway-deploy-service.sh dixian-docreader

  deploy-app:
    name: Deploy API to Railway
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_NAME: production
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.0
      - name: Deploy API
        run: ./scripts/railway-deploy-service.sh dixian-app

  deploy-frontend:
    name: Deploy frontend to Railway
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_NAME: production
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.40.0
      - name: Deploy frontend
        run: ./scripts/railway-deploy-service.sh dixian-ui

  production-smoke-test:
    name: Verify production endpoints
    needs: [deploy-docreader, deploy-app, deploy-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify API and frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://dixian-app-production.up.railway.app/health >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                https://dixian-ui-production.up.railway.app/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Dixian production endpoints did not become healthy in time." >&2
          exit 1
