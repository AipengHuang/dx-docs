# Railway source build for the Dixian API service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.app"
watchPatterns = [
  "/cmd/**",
  "/config/**",
  "/dataset/**",
  "/docker/Dockerfile.app",
  "/go.mod",
  "/go.sum",
  "/internal/**",
  "/migrations/**",
  "/railway/app.toml",
  "/scripts/**",
  "/skills/preloaded/**"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 30
